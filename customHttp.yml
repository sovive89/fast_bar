# Cabeçalhos de segurança da AWS Amplify (antes ficavam no vercel.json, que a Amplify não lê).
customHeaders:
  - pattern: "**"
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - key: X-Frame-Options
        value: DENY
